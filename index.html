<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tawuniya A'amal App</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one 402px phone frame. Home has the purple header; every other tab has a white header, as in the Figma file Wah9eoCvmM7ZIf21fHNdHG.
   Pushed screens (Policy Details, Customize, Personal Details) hide the tab bar. The AI chat opens as a sheet from the floating button. */
:root{--page:#e8e6f1;--brand:#6b47f5;--dark:#34295e;--ink:#1e2939;--blk:#0b0d14;--mut:#6b7283;--ln:#ecf0f3;--sf:#f9fafc;--lt:#f8f6ff;--chip:#f4f4f9;--ok:#329a64;--okbg:#f1f9f5;--wa:#9b7908;--wabg:#fcf9ed;--er:#bb393b;--erbg:#fdf2f2;--sub:#455560;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14121f}}
:root[data-theme="dark"]{--page:#14121f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);font-family:'Nunito Sans',Tawuniya,'Segoe UI',system-ui,sans-serif;font-weight:400;color:var(--blk);display:flex;justify-content:center;align-items:center}
h1,h2,h3,h4,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg{display:block;flex:none}
.ph{position:relative;width:100%;max-width:402px;height:100%;background:#fff;overflow:hidden}
@media (min-width:500px){.ph{max-width:418px;height:min(890px,96vh);border-radius:44px;border:8px solid #15131f;box-shadow:0 24px 70px rgba(30,20,80,.25)}.sb{display:flex!important}}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;display:none;background:#fff}
.view::-webkit-scrollbar{display:none}
.view.on{display:block}
.view.flow.on{display:flex;flex-direction:column}
.pad{padding-bottom:120px}
.sb{display:none;justify-content:space-between;align-items:center;height:44px;padding:0 28px 0 34px;font-size:16px;font-weight:600;flex:none}
.sb span:last-child{display:flex;gap:6px;align-items:center}
/* headers */
.top{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 16px}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.1px}
.ib{width:36px;height:36px;display:grid;place-items:center}
.top .acts2{display:flex;gap:10px}
.hero{background:var(--brand);color:#fff;padding:0 0 0}
.hero .top h1{color:#fff}
.hero-h{padding-bottom:0}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:100px;background:#fff;color:var(--brand);font-size:13px;font-weight:500;box-shadow:0 0 0 1px rgba(107,71,245,.15)}
.hi{font-size:20px;line-height:28px;font-weight:600;padding:12px 16px 0}
.hs{font-size:12px;line-height:18px;padding:2px 16px 0;font-weight:400}
.carwrap{display:flow-root;margin-top:14px;background:linear-gradient(var(--brand) 0 78%,#fff 78%)}
.car{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car::after,.chips::after,.mini::after{content:'';flex:none;width:1px}
.car{scroll-padding:0 16px}.chips,.mini{scroll-padding:0 16px}
.car::after{width:8px}.chips::after,.mini::after{width:8px}
/* policy card */
.pc{position:relative;flex:none;width:320px;scroll-snap-align:start;background:#3a2d6b;color:#fff;border-radius:24px;padding:16px 16px 18px;overflow:hidden;text-align:left}
button.pc{display:block;width:100%}
.car .pc{width:320px}
.pc.full{width:100%}
.pc .art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pc .top2{display:flex;align-items:center;justify-content:space-between;position:relative}
.cat{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border:1px solid rgba(255,255,255,.85);border-radius:100px;font-size:12px;font-weight:500}
.star{width:34px;height:34px;display:grid;place-items:center;color:#fff;margin:-6px -6px 0 0}
.pg{display:grid;grid-template-columns:1fr auto;gap:10px 12px;margin-top:22px;position:relative}
.pg small{display:block;font-size:12px;color:#cfc6ec;line-height:16px}
.pg b{font-size:15px;line-height:20px;font-weight:600;display:block;margin-top:2px}
.pg .r{text-align:right}
/* sections */
.sec{margin:16px 16px 0;border-radius:20px;padding:16px}
.sec.sf{background:var(--sf);border:1px solid var(--ln)}.sec.lt{background:var(--lt)}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h3{font-size:16px;line-height:22px;font-weight:600}
.link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--brand);font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px}
.task{display:flex;gap:10px;align-items:center}
.task .tx{flex:1;min-width:0}
.task h4{font-size:14px;line-height:20px;font-weight:600}
.task p{font-size:12px;line-height:18px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{flex:none;font-size:11px;line-height:16px;padding:3px 10px;border-radius:100px;white-space:nowrap;font-weight:500}
.tg.r{background:var(--erbg);color:var(--er)}.tg.y{background:var(--wabg);color:var(--wa)}.tg.p{background:#efeafe;color:var(--brand)}.tg.g{background:var(--okbg);color:var(--ok)}
.tg.c{width:24px;height:24px;padding:0;display:grid;place-items:center;font-size:12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:0 12px;font-size:12px;font-weight:600;color:var(--sub);height:42px}
.qa button svg{color:var(--brand)}
.res{display:flex;align-items:center;gap:12px;justify-content:space-between;width:100%}
.res h4{font-size:14px;line-height:20px;font-weight:600}
.res small{font-size:12px;color:var(--mut)}
.bar{height:6px;border-radius:6px;background:var(--ln);margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--ln);margin-bottom:12px}
.tabs button{padding:6px 0 10px;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);font-weight:600;border-color:var(--brand)}
.help{display:flex;align-items:center;gap:12px;justify-content:space-between;width:calc(100% - 32px);margin:16px 16px 0;background:var(--lt);border-radius:20px;padding:16px}
.help .ic{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center}
.help div{flex:1}
.help h3{font-size:15px;font-weight:600}.help p{font-size:12px;color:var(--mut);margin-top:2px}
.go{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:100px;background:var(--chip);font-size:14px;color:var(--blk)}
.chips button svg{color:var(--brand)}
.chips button.on{background:var(--brand);color:#fff;font-weight:500}.chips button.on svg{color:#fff}
.list{display:flex;flex-direction:column;gap:16px;padding:14px 16px 120px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 32px;color:var(--mut);font-size:13px;line-height:20px}
.empty .ic{width:64px;height:64px;border-radius:50%;background:var(--lt);color:var(--brand);display:grid;place-items:center;margin-bottom:6px}
.empty h3{font-size:16px;color:var(--blk);font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:44px;background:var(--chip);border-radius:12px;padding:0 12px;margin:2px 16px 6px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--blk);font:inherit;font-size:14px;outline:0}
/* performance */
.bo{margin:10px 16px 0;background:var(--lt);border-radius:16px;padding:14px 16px 16px}
.bo .sh{margin-bottom:10px}.bo .sh h3{font-size:15px}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.met{background:#fff;border-radius:12px;padding:10px 10px 10px;min-width:0}
.met svg{color:var(--brand);margin-bottom:6px}
.met b{display:block;font-size:17px;line-height:22px;font-weight:600;font-variant-numeric:tabular-nums}
.met small{font-size:11px;color:var(--ink);line-height:14px;display:block;white-space:nowrap}
.pcard{margin:14px 16px 0;border:1.5px solid #eeeeef;border-radius:24px;padding:16px;background:#fff}
.pcard .sh h3{font-size:15px;font-weight:600}
.big{font-size:26px;line-height:34px;font-weight:700;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.sar{display:inline-block;width:.7em;height:.78em;vertical-align:-.02em;margin-right:.22em;flex:none}
.big .sar{width:.66em;height:.74em;margin-right:.16em}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px}
.leg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:12px;color:var(--mut);margin-top:8px}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:9px;height:9px;border-radius:50%;flex:none}
.leg b{font-weight:600;color:var(--blk)}
/* more */
.mh{background:var(--brand);color:#fff;border-radius:0 0 24px 24px;padding-bottom:16px}
.prof{display:flex;align-items:center;gap:12px;padding:6px 16px 0;width:100%}
.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#d9cdff,#9b82ff);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:600;flex:none;overflow:hidden}
.prof h3{font-size:20px;line-height:26px;font-weight:600}.prof small{display:block;font-size:12px;opacity:.85;margin-top:1px}
.grp{margin:16px 16px 0;border:1px solid var(--ln);border-radius:16px;padding:0 16px;background:#fff}
.row{display:flex;align-items:center;gap:12px;width:100%;font-size:14px;min-height:52px;position:relative}
.row+.row::before{content:"";position:absolute;left:32px;right:0;top:0;border-top:1px solid var(--ln)}
.row svg:first-child{color:var(--brand)}
.row span{flex:1}
.row .ch{color:#6b7283;flex:none}
.lang{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:10px;background:var(--chip);font-size:13px;font-weight:600}
.foot{text-align:center;font-size:10px;line-height:18px;color:var(--ink);padding:20px 16px 0}
/* push screens */
.nh{display:flex;align-items:center;gap:8px;height:56px;padding:0 12px;flex:none;background:#fff}
.nh button{width:32px;height:36px;display:grid;place-items:center}
.nh h2{font-size:15px;font-weight:600}
.scroll{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0;position:relative}
.scroll::-webkit-scrollbar{display:none}
.crow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px;position:relative;transition:box-shadow .2s,border-color .2s}
.crow.drag{box-shadow:0 10px 28px rgba(107,71,245,.22);border-color:var(--brand);z-index:2;transition:none}
.crow.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.grip{width:18px;height:36px;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}
.crow .tx{flex:1;min-width:0}
.crow h4{font-size:15px;line-height:20px;font-weight:600}
.crow p{font-size:12px;line-height:16px;color:var(--ink);margin-top:3px}
.tog{width:40px;height:24px;border-radius:24px;background:#6b7283;position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog.on{background:var(--brand)}.tog.on::after{transform:translateX(16px)}
.vt{position:absolute;left:16px;right:16px;bottom:8px;z-index:3;display:flex;align-items:center;gap:10px;background:var(--wabg);color:#4a3d05;border-radius:10px;padding:12px;font-size:12px;box-shadow:0 4px 14px rgba(155,121,8,.18);transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
.vt.on{transform:none;opacity:1}
.vt svg{color:var(--wa)}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:16px;font-size:14px;font-weight:500;width:100%}
.bt.pr{background:var(--brand);color:#fff}.bt.sc{border:1px solid var(--brand);color:var(--brand);background:#fff}
.bt.dg{border:1px solid var(--er);color:var(--er);background:#fff}
.acts{display:flex;flex-direction:column;gap:12px;padding:12px 16px 28px;flex:none;background:#fff;position:relative}
.me{display:flex;flex-direction:column;align-items:center;padding:10px 16px 6px}
.me .av{width:79px;height:79px;font-size:28px;position:relative;overflow:visible}
.me .crown{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:var(--brand);color:#fff;font-size:10px;font-weight:500;padding:2px 8px;border-radius:100px;white-space:nowrap}
.me h3{font-size:14px;font-weight:600;margin-top:18px}.me small{color:var(--mut);font-size:12px;margin-top:2px}
.ctc{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:14px 16px;border:1px solid var(--ln);border-radius:16px}
.ctc>svg:first-child{color:var(--brand);align-self:flex-start;margin-top:3px}
.ctc div{flex:1;min-width:0}
.ctc small{display:block;font-size:12px;color:var(--mut)}
.ctc b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.ctc .ed{color:var(--brand)}
.ro{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:12px;padding:14px 12px;margin-top:12px;font-size:14px;color:var(--ink)}
.ro svg{color:var(--brand)}.ro b{margin-left:auto;font-weight:600;color:var(--blk)}
/* requests */
.rg{padding:0 16px;margin-top:10px}
.rg>small{display:block;font-size:14px;color:var(--mut);margin:12px 0 8px}
.sw{position:relative;overflow:hidden;margin-bottom:12px;border-radius:12px;touch-action:pan-y}
.sw .in{display:flex;gap:10px;transition:transform .25s}
.sw .rc{flex:none;width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px;min-height:56px}
.sw .ac{flex:none;display:flex;gap:10px}
.sw .ac button{width:82px;border-radius:12px;font-size:15px;display:grid;place-items:center;font-weight:500}
.ac .v{background:#d9e6fb;color:#3b82f6}.ac .a{background:#d4e9dd;color:#4f9a73}
.rc .ti{width:36px;height:36px;border-radius:8px;background:var(--chip);color:var(--dark);display:grid;place-items:center;flex:none}
.rc .tx{flex:1;min-width:0}
.rc h4{font-size:14px;line-height:19px;font-weight:600}
.rc p{font-size:12px;line-height:16px;color:var(--mut)}
/* policy details */
.dcard{margin:6px 16px 0;border:1px solid var(--ln);border-radius:20px;padding:12px}
.dh{display:flex;align-items:center;gap:8px;padding:4px 4px 12px}
.dh .k{font-size:12px;font-weight:600}.dh h3{font-size:14px;font-weight:600;color:var(--ink)}
.dh>div{flex:1}
.eb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--brand);color:var(--brand);border-radius:100px;font-size:12px;font-weight:500}
.dg{background:var(--sf);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:14px}
.dg small{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.dg small svg{color:var(--ink)}
.dg b{display:flex;align-items:center;font-size:14px;font-weight:600;margin:2px 0 0 28px}
.dg b,.dg b *{font-family:'Nunito Sans',Tawuniya,'Segoe UI',system-ui,sans-serif!important;font-size:14px;line-height:20px;font-weight:600;font-style:normal;font-variant-numeric:lining-nums;font-synthesis:none;letter-spacing:0;color:var(--blk)}
.dsec{margin:16px 16px 0;border-radius:20px;padding:16px}
.dsec.sf{background:var(--sf)}
.dsec h3{font-size:16px;font-weight:600;margin-bottom:12px}
.mini{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.mini::-webkit-scrollbar{display:none}
.mini button{flex:none;height:32px;padding:0 14px;border-radius:100px;background:#ecedf3;font-size:13px;color:var(--mut)}
.mini button.on{background:var(--brand);color:#fff;font-weight:500}
.hi2{display:flex;align-items:center;gap:6px}
.hist{background:#fff;border-radius:12px;padding:8px;margin-bottom:10px}
.hr{display:flex;align-items:center;gap:10px;padding:2px}
.hr .ti{width:36px;height:36px;border-radius:8px;background:var(--chip);color:var(--dark);display:grid;place-items:center;flex:none}
.hr .tx{flex:1;min-width:0}.hr h4{font-size:13px;font-weight:600;line-height:17px}.hr p{font-size:12px;color:var(--mut);line-height:15px}
.hr .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.hr .rt small{font-size:12px;color:var(--mut)}
.hr .mb{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--chip);padding:2px 8px;border-radius:100px;color:var(--ink)}
.hr .mb svg{color:#2563eb}
.why{display:flex;gap:10px;background:#fcefec;border-radius:10px;padding:12px;margin-top:8px;font-size:13px;line-height:19px;color:var(--blk)}
.why b{color:var(--er);font-weight:600;display:block}
.why svg{color:var(--er);margin-top:1px}
.dflex{display:flex;align-items:center;gap:20px}
.dleg{display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--ink);flex:1;min-width:0}
.dleg div{display:flex;align-items:center;gap:8px}.dleg i{width:12px;height:12px;border-radius:4px;flex:none}.dleg b{margin-left:auto;font-weight:600;color:var(--blk)}
/* nav + fab + overlays */
.nav{position:absolute;left:0;right:0;bottom:0;height:88px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -1px 0 var(--ln),0 -6px 20px rgba(30,20,80,.06);display:flex;padding:10px 6px 0;z-index:5;transition:transform .25s}
.nav.off{transform:translateY(100%)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:14px;color:#1e2939;height:54px;justify-content:center}
.nav button.on{color:var(--brand);font-weight:600}
.nav i{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:100px;background:#7d7d7d}
.hind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:100px;background:#7d7d7d;z-index:4;pointer-events:none}
.fab{position:absolute;left:12px;bottom:100px;width:80px;height:80px;z-index:6;padding:0;background:none;border:0;pointer-events:none;--spr:cubic-bezier(.34,1.45,.5,1);animation:fabin .6s var(--spr) backwards}
.fab .disc{position:absolute;left:0;bottom:0;width:80px;height:80px;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(107,71,245,.28),0 0 0 1px rgba(107,71,245,.1);transform-origin:0 100%;transition:transform .55s var(--spr),box-shadow .3s;pointer-events:auto;cursor:pointer}
.fab .ico{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;transition:transform .55s var(--spr),opacity .35s;pointer-events:none}
.fab .ico img{width:100%;height:100%;object-fit:contain;display:block}
.fab[data-s=small] .disc{transform:scale(.75)}
.fab[data-s=small] .ico{transform:translate(-10px,10px) scale(.58)}
.fab[data-s=hidden] .disc{transform:translateX(-48px) scale(.75);box-shadow:0 4px 14px rgba(107,71,245,.18),0 0 0 1px rgba(107,71,245,.08)}
.fab[data-s=hidden] .ico{transform:translate(-58px,10px) scale(.58);opacity:.64}
.fab.off{opacity:0;pointer-events:none!important;transform:scale(.8);transition:opacity .2s,transform .2s}
.fab.off .disc{pointer-events:none}
@keyframes fabin{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.bub{position:absolute;left:100px;bottom:124px;z-index:6;background:#fff;border:1px solid #cfc4fb;border-radius:12px;padding:10px 14px;font-size:13px;line-height:18px;color:var(--brand);box-shadow:0 4px 18px rgba(52,41,94,.14);opacity:0;transform:translateX(-6px);transition:.3s;pointer-events:none}
.bub.on{opacity:1;transform:none}
.toast{pointer-events:none;position:absolute;top:56px;left:16px;right:16px;z-index:30;background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:0 8px 28px rgba(30,20,80,.2);transform:translateY(-160px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .2s}
.toast.on{transform:none;opacity:1}
.toast svg{color:var(--ok)}
.dim{position:absolute;inset:0;background:rgba(20,16,40,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:21;padding:20px 16px 36px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px}
.sheet.on{transform:none}
.sheet h3{font-size:18px;font-weight:600}.sheet p{font-size:13px;color:var(--mut);line-height:20px}
.chat{position:absolute;inset:0;z-index:40;pointer-events:none}
.chat .dim{display:none}
.chat.on{pointer-events:auto}
.cp{position:absolute;inset:0;background:#fff;overflow:hidden;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:1}
.chat.on .cp{transform:none}
.cg{display:none!important;height:20px;flex:none;place-items:center;background:#fff}
.cg i{width:40px;height:4px;border-radius:4px;background:#d5dae1}
.cp iframe{flex:1;width:100%;border:0;min-height:0;background:#f8f6ff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  $('#v-performance').innerHTML=`${hdr('Performance',`<button class="ib" data-act="pcustomize" aria-label="Customize widgets">${ic('sliders',24,1.6)}</button>`)}

  <div class="bo"><div class="sh"><h3>Business Overview</h3><button class="link" data-act="soon">View All ${ic('arrow',16)}</button></div>${mets(f)}</div>
  ${S.widgets.filter(w=>w.on).map(w=>W[w.id]()).join('')}<p style="font-size:11px;color:var(--mut);text-align:center;padding:16px">Sample figures for the prototype. Category tabs scale them.</p>`;
}

/* ---------- navigation ---------- */
const NI={
 home:a=>a?`<svg width="26" height="26" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.800 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg>`:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M12 3 3.500 10v10.500h6v-6h5v6h6V10z"/></svg>`,
 policies:a=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><rect x="3" y="5.500" width="18" height="13" rx="4"/><circle cx="12" cy="12" r="2.600"/><path d="M6.500 9.500v5M17.500 9.500v5"/></svg>`,
 requests:a=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4.500h9a3 3 0 0 1 3 3V15"/><rect x="3.500" y="7.500" width="13" height="12" rx="3.500"/><path d="M7 12.500h6M7 15.500h4"/></svg>`,
 performance:a=>a?`<svg width="26" height="26" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/><path d="M8 17v-5M12 17V7M16 17v-3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>`:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><rect x="3.500" y="3.500" width="17" height="17" rx="5"/><path d="M8.500 16.500v-4M12 16.500v-8M15.500 16.500v-2.500"/></svg>`,
 more:a=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="7" cy="7" r="2.400"/><circle cx="17" cy="7" r="2.400"/><circle cx="7" cy="17" r="2.400"/><circle cx="17" cy="17" r="2.400"/></svg>`};
const NAVI=[['home','Home'],['policies','Policies'],['requests','Requests'],['performance','Performance'],['more','More']];
function go(v,from){
  if(from)S.prev=from;
  if(v==='customize'){S.draft=S.sections.map(s=>({...s}));renderCust('customize','Customize Dashboard',S.draft,SEC)}
  if(v==='pcustomize'){S.draft=S.widgets.map(s=>({...s}));renderCust('pcustomize','Customize Overview widgets',S.draft,WID)}
  if(v==='policies')renderPolicies(); if(v==='performance')renderPerf(); if(v==='home')renderHome(); if(v==='more')renderMore(); if(v==='requests')renderRequests(); if(v==='details')renderDetails(); if(v==='pdetail')renderPDetail();
  S.view=v;$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$('#v-'+v).scrollTop=0;
  $('#nav').classList.toggle('off',!NAVV.includes(v));$('#fab').classList.toggle('off',!FABV.includes(v));fabLast=0;fabSeq();
  $$('#nav button').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.innerHTML=NI[b.dataset.v](on)+NAVI.find(n=>n[0]===b.dataset.v)[1];on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
}
$('#nav').innerHTML=NAVI.map(n=>`<button data-act="nav" data-v="${n[0]}"></button>`).join('')+'<i></i>';
$$('#nav button').forEach(b=>b.dataset.v=b.dataset.v);
$('#fab').innerHTML='<span class="disc"></span><span class="ico">'+LOGO+'</span>';
/* AI icon states (Figma "AI Agent - FAB"): large -> info toast -> small -> hidden */
let fabT=[],fabLast=0;
function setFab(st){const f=$('#fab');f.dataset.s=st;$('#bub').classList.toggle('on',st==='toast'||false)}
function fabSeq(){fabT.forEach(clearTimeout);fabT=[];setFab('large');
  if(S.view==='home'){fabT.push(setTimeout(()=>{if(!$('#chat').classList.contains('on')&&S.view==='home')setFab('toast')},900));fabT.push(setTimeout(()=>{if($('#fab').dataset.s==='toast')setFab('small')},5600))}}
$('#ph').addEventListener('scroll',e=>{const v=e.target;if(!v.classList||!v.classList.contains('view')||!FABV.includes(S.view))return;
  const t=v.scrollTop,f=$('#fab').dataset.s;fabT.forEach(clearTimeout);fabT=[];
  if(t<=10)setFab('large');else if(t>fabLast+3)setFab('small');
  fabLast=t;fabT.push(setTimeout(()=>{if($('#fab').dataset.s==='small'&&fabLast>10)setFab('hidden')},2500))},true);

/* ---------- sheets + chat ---------- */
function sheet(h){$('#sheet').innerHTML=h;$('#dim').classList.add('on');$('#sheet').classList.add('on')}
function shut(){$('#dim').classList.remove('on');$('#sheet').classList.remove('on')}
function openChat(){fabT.forEach(clearTimeout);setFab('large');$('#cf').src='ai.html'+(matchMedia('(min-width:500px)').matches?'?sb=1':'');$('#chat').classList.add('on');$('#bub').classList.remove('on')}
function closeChat(){$('#chat').classList.remove('on');if(S.view!=='home')go('home');setTimeout(()=>{if(!$('#chat').classList.contains('on'))$('#cf').src='about:blank'},400)}
window.addEventListener('message',e=>{if(e.data&&e.data.aamal==='close')closeChat()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeChat();shut()}});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,id=+b.dataset.id;
  if(b.closest('.sw')&&!e.target.closest('.ac button'))return;
  switch(a){
   case 'nav':go(v);break;
   case 'go-perf':go('performance');break;
   case 'soon':soon();break;
   case 'chat':if(e.target.closest('#fab')&&$('#fab').dataset.s==='hidden'){setFab('large');fabT.forEach(clearTimeout);break}openChat();break;
   case 'closeChat':closeChat();break;
   case 'shut':shut();break;
   case 'customize':go('customize',S.view);break;
   case 'pcustomize':go('pcustomize','performance');break;
   case 'tog':togSection(b.dataset.id);break;
   case 'saveCust':if(S.view==='customize'){S.sections=S.draft.map(s=>({...s}));go('home');toast('Dashboard updated')}else{S.widgets=S.draft.map(s=>({...s}));go('performance');toast('Widgets updated')}break;
   case 'cancelCust':go(S.view==='pcustomize'?'performance':(S.prev||'home'));break;
   case 'open':if(e.target.closest('[data-act=pin]'))break;S.pol=POL.find(p=>p.id===id);S.dTab=0;S.hTab=0;go('pdetail',S.view);break;
   case 'pin':{e.stopPropagation();S.pinned.has(id)?S.pinned.delete(id):S.pinned.add(id);const k=$('#v-policies').scrollTop;renderPolicies.keep=1;renderPolicies();renderPolicies.keep=0;$('#v-policies').scrollTop=k;break}
   case 'backDetail':go('policies');break;
   case 'dtab':S.dTab=+v;{const k=$('#v-pdetail .scroll').scrollTop;renderPDetail();$('#v-pdetail .scroll').scrollTop=k}break;
   case 'htab':S.hTab=+v;{const k=$('#v-pdetail .scroll').scrollTop;renderPDetail();$('#v-pdetail .scroll').scrollTop=k}break;
   case 'ptab':S.pTab=v;renderPolicies.keep=1;renderPolicies();renderPolicies.keep=0;break;
   case 'psearch':S.pSearch=!S.pSearch;if(!S.pSearch)S.pQ='';renderPolicies();break;
   case 'rtab':S.rTab=v;renderRequests.keep=1;renderRequests();renderRequests.keep=0;break;
   case 'rsearch':S.rSearch=!S.rSearch;if(!S.rSearch)S.rQ='';renderRequests();break;
   case 'approve':{const el=b.closest('.sw'),r=REQ[+el.dataset.i];r.st='Approved';fillRequests();toast('Request approved');break}
   case 'view':soon();break;
   case 'ftab':{const k=$('#v-performance').scrollTop;S.perfTab=v;renderPerf();$('#v-performance').scrollTop=k;break}
   case 'acttab':S.actTab=v;{const k=$('#v-home').scrollTop;renderHome();$('#v-home').scrollTop=k}break;
   case 'details':go('details','more');break;
   case 'backMore':go('more');break;
   case 'logout':sheet(`<h3>Log out?</h3><p>You will return to the sign-in screen. This is a demo, so nothing is actually signed out.</p><button class="bt dg" data-act="logoutOk">Log out</button><button class="bt sc" data-act="shut">Cancel</button>`);break;
   case 'logoutOk':shut();go('home');toast('Logged out (demo)');break;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act=pin]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='pq'){S.pQ=e.target.value;fillPolicies()}if(e.target.id==='rq'){S.rQ=e.target.value;fillRequests()}});

/* ---------- boot ---------- */
go('home');
</script>
