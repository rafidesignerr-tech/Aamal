.pm{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;font-size:13px}

/* history drawer */
.dr{position:absolute;inset:0;z-index:30;pointer-events:none;visibility:hidden;transition:visibility 0s .3s}
.dr.on{pointer-events:auto;visibility:visible;transition:none}
.dr .scr{position:absolute;inset:0;background:rgba(16,12,32,.45);opacity:0;transition:opacity .28s}
.dr.on .scr{opacity:1}
.dr .pn{position:absolute;left:0;top:0;bottom:0;width:84%;max-width:330px;background:#fff;border-radius:0 28px 28px 0;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:16px 16px 20px;overflow:hidden}

const T={reply:700,status:2000,afterStatus:500,word:40};
const reveal=async b=>{const w=[];
  (function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3){const f=document.createDocumentFragment();(c.textContent.match(/\S+\s*|\s+/g)||[]).forEach(t=>{const sp=document.createElement('span');sp.className='sw';sp.hidden=true;sp.textContent=t;w.push(sp);f.appendChild(sp)});c.replaceWith(f)}else walk(c)})})(b);
  for(let i=0;i<w.length;i++){w[i].hidden=false;if(i%3==2)sc();await sleep(T.word)}sc()};

  const b=add('m a',h);await reveal(b);return b}

const RFR='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 0-14-5.3L4 9M4 4v5h5M4 12a8 8 0 0 0 14 5.3L20 15M20 20v-5h-5"/></svg>';
const VPN=$('#vp');
let vm='off',vSR=null,vTTS=null,vSim=false,vTok=0,simN=0;
const simPhrase=()=>{if(S.step==='collect')return VOICE;const L=['I want to add a new member to my policy.','What does my policy cover?'];return L[simN++%L.length]};
function simSR(h){h.sim&&h.sim();const p=simPhrase(),ws=p.split(' ');let i=0,tm;const iv=setInterval(()=>{i++;h.interim(ws.slice(0,i).join(' '));if(i>=ws.length){clearInterval(iv);tm=setTimeout(()=>{h.final(p)},500)}},260);return()=>{clearInterval(iv);clearTimeout(tm)}}
function startSR(h){const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SRC)return simSR(h);
  let active=true,sim=null;const sr=new SRC();sr.lang='en-US';sr.continuous=false;sr.interimResults=true;
  sr.onresult=e=>{if(!active)return;let it='',fn='';for(let j=e.resultIndex;j<e.results.length;j++){if(e.results[j].isFinal)fn+=e.results[j][0].transcript;else it+=e.results[j][0].transcript}if(it)h.interim(it);if(fn)h.final(fn)};
  sr.onend=()=>{if(active)h.end&&h.end()};
  sr.onerror=e=>{if(!active)return;const er=e&&e.error;if(er==='aborted')return;if(er==='no-speech'){h.err&&h.err();return}active=false;try{sr.abort()}catch(_){}sim=simSR(h)};
  try{sr.start()}catch(_){active=false;sim=simSR(h)}
  return()=>{active=false;if(sim){sim();sim=null;return}try{sr.abort()}catch(_){}}}
function say(text,onStart,onEnd){try{if(!('speechSynthesis' in window))throw 0;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=.92;u.onstart=onStart;u.onend=u.onerror=onEnd;speechSynthesis.speak(u);return()=>{u.onend=u.onerror=null;speechSynthesis.cancel()}}
  catch(e){onStart();const id=setTimeout(onEnd,Math.max(1800,text.length*50));return()=>clearTimeout(id)}}
function orbH(k){const bars=k==='T'?'<span class="dots"><b></b><b></b><b></b></span>':[62,54,46,38,30].map((l,i)=>`<i class="bar" style="left:${l}px;--h:${[10,18,26,18,10][i]}px;animation-delay:${i*.1}s"></i>`).join('');return `<div class="orb ${k}"><i class="oh"></i><i class="ih"></i><i class="ob"></i>${bars}</div>`}
function setVM(v){vm=v;paintVP()}
function paintVP(){const s=vm;if(s==='off'){VPN.innerHTML='';return}
  if(s==='error'){VPN.innerHTML=`<div class="t1 er"><b>I didn't catch that</b><small>Please try again.</small></div><button class="try" data-v="retry">${RFR}<span>Try again</span></button><div class="ctl2"><div class="cb"><button data-v="mute" aria-label="Microphone">${MIC2}</button><span>Mic</span></div><div class="cb"><button data-v="end" aria-label="End voice conversation">${XIC}</button><span>End</span></div></div>`;return}
  const T={starting:['How can I help you?',"I'm ready when you are"],listening:['Listening…','Ask me about your policy or claims'],speaking:['Tawuniya AI is speaking…','You can interrupt me anytime.'],thinking:['Thinking…','Let me check that for you.'],muted:['Microphone muted','You can unmute anytime.']}[s],K={starting:'St',listening:'L',speaking:'S',thinking:'T',muted:'Mu'}[s],lab=s==='speaking'?'Interrupt':s==='muted'?'Unmute':'Mute';
  VPN.innerHTML=`<div class="t1"><b>${T[0]}</b><small id="vsub">${T[1]}</small></div><div class="ctl"><div class="cb"><button data-v="mute" class="${s==='muted'?'mu':''}" aria-label="${lab}">${s==='muted'?MICSL:MIC2}</button><span class="${s==='muted'?'on':''}">${lab}</span></div>${orbH(K)}<div class="cb"><button data-v="end" aria-label="End voice conversation">${XIC}</button><span>End</span></div></div>`}
function startConv(){if(vm!=='off')return;txt.blur();menuOpen(false);vSim=false;$('#wel').style.opacity=0;$('#comp').classList.add('vc');setVM('starting');const t=++vTok;setTimeout(()=>{if(t===vTok&&vm==='starting')listen()},700)}
function listen(auto){if(auto&&vSim){setVM('listening');return}
  if(vSR){vSR();vSR=null}setVM('listening');const t0=Date.now(),tok=vTok;
  vSR=startSR({sim:()=>{vSim=true},interim:x=>{const e=$('#vsub');if(e&&vm==='listening')e.textContent=x},
    final:x=>{if(!x.trim()||tok!==vTok)return;vSR=null;heard(x.trim())},
    end:()=>{if(tok===vTok&&vm==='listening'&&Date.now()-t0>400)setVM('error')},
    err:()=>{if(tok===vTok&&(vm==='listening'||vm==='starting'))setVM('error')}})}
async function heard(t){const tok=vTok;setVM('thinking');txt.value=t;ui();const n0=M.querySelectorAll('.m.a').length;go.click();
  let reply=null;for(let i=0;i<100&&reply===null;i++){await sleep(150);if(tok!==vTok||vm!=='thinking')return;const b=[...M.querySelectorAll('.m.a')][n0];if(b&&!b.querySelector('.sw[hidden]'))reply=b.textContent.trim()}
  if(tok!==vTok||vm!=='thinking')return;
  if(!reply){listen(true);return}
  vTTS=say(reply,()=>{if(tok===vTok&&vm==='thinking')setVM('speaking')},()=>{if(tok===vTok&&vm==='speaking')listen(true)})}
function muteInt(){if(vm==='muted'||vm==='error')listen();
  else if(vm==='speaking'){if(vTTS){vTTS();vTTS=null}try{speechSynthesis.cancel()}catch(e){}listen()}
  else if(vm==='listening'){if(vSR){vSR();vSR=null}setVM('muted')}}
function endConv(){if(vm==='off')return;vTok++;if(vSR){vSR();vSR=null}if(vTTS){vTTS();vTTS=null}try{speechSynthesis.cancel()}catch(e){}
  txt.value='';ui();vm='off';paintVP();$('#comp').classList.remove('vc');if(!M.children.length&&S.step==='home')$('#wel').style.opacity=''}
VPN.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;const v=b.dataset.v;if(v==='end')endConv();else if(v==='mute')muteInt();else if(v==='retry')listen()});

$('#home').onclick=()=>{endConv();if(window.parent!==window)parent.postMessage({aamal:'close'},'*');else location.reload()};

(()=>{const kb=$('#kb'),ph=$('#ph');if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
 let cur=null;
 const SH='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.7" stroke-linejoin="round"><path d="M12 4l8 8h-5v6H9v-6H4z"/></svg>',BK='<svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M9 2h14a2 2 0 012 2v12a2 2 0 01-2 2H9L1 10z"/><path d="M13 7l6 6M19 7l-6 6"/></svg>',RT='<svg width="24" height="20" viewBox="0 0 24 20" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3v7H5M9 5.5L4.5 10 9 14.5"/></svg>',EM='<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"><circle cx="20" cy="20" r="14"/><path d="M13 22c1.5 5 12.5 5 14 0z" fill="#000"/><circle cx="15" cy="16" r="1.3" fill="#000"/><circle cx="25" cy="16" r="1.3" fill="#000"/></svg>',MC='<svg width="26" height="40" viewBox="0 0 26 40" fill="none" stroke="#000" stroke-width="1.7" stroke-linecap="round"><rect x="8" y="7" width="10" height="17" rx="5"/><path d="M4 19a9 9 0 0018 0M13 28v5M9 33h8"/></svg>';
 let mode='abc',up=false;
 const K=(l,c='',label)=>`<button class="k ${c}" data-k="${l}">${label??l}</button>`;
 const render=t=>{kb.className='kb'+(t==='tel'?' num':'');
  if(t==='tel'){const R=a=>`<div class="r">${a.map(([n,l])=>`<button class="k" data-k="${n}">${n}<small>${l}</small></button>`).join('')}</div>`;
   kb.innerHTML=R([['1',''],['2','ABC'],['3','DEF']])+R([['4','GHI'],['5','JKL'],['6','MNO']])+R([['7','PQRS'],['8','TUV'],['9','WXYZ']])+`<div class="r" style="margin-bottom:0"><button class="k fn" data-k="Done" style="font-size:18px">Done</button><button class="k" data-k="0">0<small></small></button><button class="k fn" data-k="⌫">${BK}</button></div>`;return}
  const L={abc:['qwertyuiop','asdfghjkl','zxcvbnm'],num:['1234567890','-/:;()$&@"','.,?!\''],sym:['[]{}#%^*+=','_\\|~<>€£¥•','.,?!\'']}[mode];
  const cs=c=>up&&mode==='abc'?c.toUpperCase():c;
  const r3=mode==='abc'?K('⇧',(up?'on ':'')+'fn','' ).replace('></button>','>'+SH+'</button>'):K(mode==='num'?'#+=':'123','fn',mode==='num'?'#+=':'123');
  kb.innerHTML=`<div class="pr"><span>“The”</span><span>the</span><span>to</span></div><div class="r">${L[0].split('').map(c=>K(c,'',cs(c))).join('')}</div><div class="r">${L[1].split('').map(c=>K(c,'',cs(c))).join('')}</div><div class="r">${r3}<span style="display:flex;gap:6px;${mode==='abc'?'':'margin:0 auto'}">${L[2].split('').map(c=>K(c,'',cs(c))).join('')}</span>${K('⌫','fn',BK)}</div><div class="r" style="margin-bottom:0">${K(mode==='abc'?'123':'ABC','w')}${K('space','sp',' ')}${K('Done','w',RT)}</div><div class="bt"><span style="position:absolute;left:28px;top:17px">${EM.replace('width="40" height="40"','width="28" height="28"')}</span><span style="position:absolute;right:36px;top:14px">${MC.replace('width="26" height="40"','width="18" height="28"')}</span></div>`};
 const show=el=>{cur=el;mode='abc';up=false;render(el.inputMode==='tel'?'tel':'email');kb.hidden=false;ph.classList.add('kbv');const f=!!el.closest('.fi');ph.classList.toggle('kbo',f);setTimeout(()=>f?el.scrollIntoView({block:'center',behavior:'smooth'}):M.scrollTo({top:M.scrollHeight,behavior:'smooth'}),30)};
 const hide=()=>{kb.hidden=true;ph.classList.remove('kbo','kbv');cur=null};
 document.addEventListener('focusin',e=>{if((e.target.closest('.fi')&&e.target.tagName==='INPUT')||e.target.id==='txt')show(e.target)});
 document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!kb.hidden&&!a?.closest?.('.fi')&&a?.id!=='txt')hide()},0));
 kb.addEventListener('mousedown',e=>e.preventDefault());go.addEventListener('mousedown',e=>{if(!kb.hidden)e.preventDefault()});
 kb.addEventListener('click',e=>{const b=e.target.closest('.k');if(!b||!cur)return;const k=b.dataset.k;
  if(k==='Done'){if(cur.id==='txt'){go.click();return}cur.blur();hide();return}
  if(k==='⇧'){up=!up;render('email');return}
  if(k==='123'){mode='num';render('email');return}if(k==='ABC'){mode='abc';render('email');return}if(k==='#+='){mode='sym';render('email');return}
  const st=cur.selectionStart??cur.value.length,en=cur.selectionEnd??st;
  if(k==='⌫'){if(st===en&&st>0)cur.setRangeText('',st-1,st,'end');else cur.setRangeText('',st,en,'end')}
  else{const ch=k==='space'?' ':(up&&mode==='abc'?k.toUpperCase():k);cur.setRangeText(ch,st,en,'end');if(up){up=false;render('email')}}
  cur.dispatchEvent(new Event('input',{bubbles:true}))});
})();
['input','change','keyup','blur','paste'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.id==='ph1'||e.target.id==='em')setTimeout(chk,0)},true));

/* chat history drawer */
const HIST=[['Today',['Add a member to Health A-Level','Policy coverage question']],['Yesterday',['Start a new claim','Coverage recommendations']],['Previous 7 days',['Remove a member from MOTOR C','Company’s insights – Q3','Upgrade employee class','Policy renewal dates']]];
const CHI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>';
function drawHist(q=''){const cur=S.step!=='home'||$('#msgs').children.length>0;q=q.trim().toLowerCase();let n=0;
  $('#hl').innerHTML=HIST.map(([g,items],gi)=>{const its=(gi===0&&cur?['New conversation',...items.slice(0,2)]:items).filter(t=>!q||t.toLowerCase().includes(q));if(!its.length)return'';n+=its.length;
    return `<div class="gh">${g}</div>`+its.map(t=>`<button class="hi${gi===0&&cur&&t==='New conversation'?' cur':''}" data-a="openChat">${CHI}<span>${t==='New conversation'&&S.pol?'Add a member to '+S.pol.split(' — ')[0]:t}</span></button>`).join('')}).join('')||'';
  if(!n)$('#hl').innerHTML='<div class="none">No chats found</div>'}
